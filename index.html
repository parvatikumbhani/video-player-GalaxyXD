<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GalaxyXD | YouTube Bypass</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    
    @font-face {
      font-family: "Starborn";
      src: url("fonts/Starborn.otf") format("opentype");
    }

    body {
      margin: 0;
      background: #000000;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
    }

    /* Main Glossy Card */
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.8) 100%);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 1);
    }

    .rainbow-title {
      font-family: "Starborn", sans-serif;
      font-size: 34px;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #a78bfa, #f472b6, #fb923c, #a78bfa);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: galaxyMove 5s linear infinite;
    }

    @keyframes galaxyMove {
      0% { background-position: 0% }
      100% { background-position: 300% }
    }

    /* Glossy Black & White Blended Button */
    .glossy-btn {
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* The "Glossy Layer" Reflection */
    .glossy-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
      pointer-events: none;
    }

    .glossy-btn:hover {
      border-color: rgba(255, 255, 255, 0.5);
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(10,10,10,1) 100%);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .video-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .video-item img {
      width: 100px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
    }

    .glass-input {
      background: rgba(0, 0, 0, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body>
  <div class="glass-card w-full max-w-[480px] p-10 text-center">
    <h2 class="rainbow-title mb-10">YouTube Bypass</h2>

    <div class="flex flex-col gap-4">
      <input id="search" 
        class="glass-input w-full rounded-2xl px-6 py-4 text-sm transition-all outline-none focus:ring-1 focus:ring-white/30 placeholder:text-gray-600 text-white"
        placeholder="Search videos..."
        autocomplete="off">
      
      <button onclick="searchVideos()" 
        class="glossy-btn w-full font-bold py-4 rounded-2xl transition-all active:scale-[0.97] text-white tracking-wide">
        Search
      </button>
    </div>

    <div id="results" class="mt-8 max-h-[300px] overflow-y-auto pr-2"></div>
    <div id="player" class="rounded-2xl overflow-hidden mt-6"></div>
  </div>

  <div class="fixed bottom-6 right-6 bg-black/60 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-full text-xs font-medium shadow-2xl">
    <span class="opacity-40">Created by</span> 
    <a href="http://discord.com/users/964647720767868988" target="_blank" class="text-white hover:text-indigo-400 transition-colors ml-1 font-bold">GalaxyXD</a>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const searchInput = document.getElementById('search');
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchVideos();
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
