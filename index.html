<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Bypass</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    
    @font-face {
      font-family: "Starborn";
      src: url("fonts/Starborn.otf") format("opentype");
    }

    body {
      margin: 0;
      background: radial-gradient(circle at center, #0a0a0f 0%, #000000 100%);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      box-shadow: 
        0 4px 24px -1px rgba(0, 0, 0, 0.8),
        0 0 40px 5px rgba(124, 58, 237, 0.05);
    }

    .rainbow-title {
      font-family: "Starborn", sans-serif;
      font-size: 34px;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #a78bfa, #f472b6, #fb923c, #a78bfa);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: galaxyMove 5s linear infinite;
    }

    @keyframes galaxyMove {
      0% { background-position: 0% }
      100% { background-position: 300% }
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .video-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.03) translateX(5px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .video-item img {
      width: 100px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
    }

    #results::-webkit-scrollbar {
      width: 5px;
    }
    #results::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    #player {
      border-radius: 20px;
      overflow: hidden;
      margin-top: 24px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      backdrop-filter: blur(5px);
    }

    /* New Glossy Black Button Style */
    .black-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      transition: all 0.3s ease;
    }

    .black-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

<body>
  <div class="glass-card w-full max-w-[480px] p-10 text-center">
    <h2 class="rainbow-title mb-10">YouTube Bypass</h2>

    <div class="flex flex-col gap-4">
      <input id="search" 
        class="glass-input w-full rounded-2xl px-6 py-4 text-sm transition-all outline-none focus:ring-2 focus:ring-white/10 placeholder:text-gray-600 text-white"
        placeholder="Search videos..."
        autocomplete="off">
      
      <button onclick="searchVideos()" 
        class="black-btn w-full font-bold py-4 rounded-2xl transition-all active:scale-[0.97] shadow-2xl">
        Search
      </button>
    </div>

    <div id="results" class="mt-8 max-h-[300px] overflow-y-auto pr-2"></div>
    <div id="player"></div>
  </div>

  <div class="fixed bottom-6 right-6 bg-black/40 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-full text-xs font-medium shadow-2xl">
    <span class="opacity-40">Developed by</span> 
    <a href="http://discord.com/users/964647720767868988" target="_blank" class="text-white hover:text-indigo-400 transition-colors ml-1 font-bold">GalaxyXD</a>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  
  <script>
    const searchInput = document.getElementById('search');

    searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            searchVideos();
        }
    });
  </script>
  
  <script src="script.js"></script>
</body>
</html>
