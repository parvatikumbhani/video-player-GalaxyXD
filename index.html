<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Bypass</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    
    @font-face {
      font-family: "Starborn";
      src: url("fonts/Starborn.otf") format("opentype");
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top right, #1e1b4b, #09090b);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Galaxy Animated Title */
    .rainbow-title {
      font-family: "Starborn", sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
      background: linear-gradient(
        90deg,
        #a78bfa, #f472b6, #fb923c, #a78bfa
      );
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: galaxyMove 5s linear infinite;
    }

    @keyframes galaxyMove {
      0% { background-position: 0% }
      100% { background-position: 300% }
    }

    /* CURVED SEARCH RESULTS */
    .video-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px; /* High curvature */
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .video-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.02);
      border-color: rgba(167, 139, 250, 0.5);
    }

    .video-item img {
      width: 100px;
      height: 56px;
      border-radius: 10px; /* Curved thumbnails */
      object-fit: cover;
    }

    .video-item span {
      font-size: 14px;
      font-weight: 500;
      color: #f1f5f9;
      text-align: left;
      line-height: 1.2;
    }

    /* Custom Scrollbar */
    #results::-webkit-scrollbar {
      width: 6px;
    }
    #results::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    #player {
      border-radius: 16px;
      overflow: hidden;
      margin-top: 20px;
      background: black;
    }
  </style>
</head>

<body>
  <div class="glass-card w-full max-w-[460px] p-8 rounded-[28px] text-center">
    <h2 class="rainbow-title mb-8">YouTube Bypass</h2>

    <div class="flex flex-col gap-3">
      <input id="search" 
        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3.5 text-sm transition-all outline-none focus:ring-2 focus:ring-indigo-500/50 placeholder:text-gray-500"
        placeholder="Search videos...">
      
      <button onclick="searchVideos()" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl transition-all active:scale-[0.98] shadow-lg shadow-indigo-500/20">
        Search
      </button>
    </div>

    <div id="results" class="mt-6 max-h-[320px] overflow-y-auto pr-1">
        </div>

    <div id="player"></div>
  </div>

  <div class="fixed bottom-6 right-6 bg-white/5 backdrop-blur-md border border-white/10 px-5 py-2.5 rounded-full text-xs font-medium">
    <span class="opacity-50">Developed by</span> 
    <a href="http://discord.com/users/964647720767868988" target="_blank" class="text-indigo-400 hover:text-indigo-300 transition-colors ml-1 font-bold">GalaxyXD</a>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
